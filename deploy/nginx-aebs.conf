# Konfigurasi nginx untuk AEBS Simulator (situs statis).
# Dipakai oleh Dockerfile, atau copy ke /etc/nginx/conf.d/ pada instalasi manual.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Modul ES (.js) harus dilayani sebagai application/javascript.
    # nginx bawaan sudah menyertakan /etc/nginx/mime.types, jangan ditimpa.

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript image/svg+xml;

    # Tanpa backend: tidak ada file rahasia, tidak ada eksekusi.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML tidak di-cache supaya update langsung terlihat.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Aset kecil, cache pendek supaya revisi cepat tersebar.
    location ~* \.(js|css|svg|png)$ {
        add_header Cache-Control "public, max-age=300" always;
    }
}
